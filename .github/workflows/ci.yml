name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # CLAUDE.md non-negotiable 5: the engines run under a non-UTC zone so a Date on a day path goes red here.
      TZ: America/Chicago
      # Ephemeral runner-local Postgres, gone when the job ends.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ledgerleave_test?connection_limit=10&pool_timeout=20
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ledgerleave_test?connection_limit=10&pool_timeout=20
      AUTH_SECRET: ci-only-secret-not-for-real-use-0123456789abc
      APP_URL: http://localhost:7300
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: America/Chicago # a non-UTC server zone, like the laptop's, so the db timezone test can go red here
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Ledgerleave gate (docs/phase-1-tasks.md 1.12): purity lint, oracle agreement, balance recompute, frozen fixtures.
      # leave:eval runs BEFORE fixtures:check so a product-code write into fixtures/ fails the clean-tree test.
      - run: npm run engine:lint
      - run: npm run leave:eval
      - run: npm run ledger:verify
      - run: npm run fixtures:check
      - run: createdb ledgerleave_test
      - run: npx prisma migrate deploy
      - run: npx vitest run
      # Production build, served — the way it ships. login.spec.ts drives a real page.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  # Spec §4 / §13.3: both modules deleted by the manifest, and the tree must still generate, typecheck, build and pass drift.
  modules-removed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run foundation:check-modules
